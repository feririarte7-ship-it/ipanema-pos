<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPANEMA IBIZA — POS</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap');

  :root {
    --bg: #0a0a0a;
    --surface: #141414;
    --surface2: #1e1e1e;
    --border: #2a2a2a;
    --gold: #c9a84c;
    --gold-dim: #8a6e2f;
    --text: #f0ede8;
    --text-dim: #888;
    --red: #e05252;
    --green: #52c48a;
    --radius: 6px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
  }

  /* ── HEADER ── */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  .header-brand {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 18px;
    letter-spacing: 0.08em;
    color: var(--gold);
  }
  .header-right { display: flex; align-items: center; gap: 16px; }
  .header-date { font-size: 12px; color: var(--text-dim); }

  .btn-load {
    padding: 6px 14px;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: var(--radius);
    cursor: pointer;
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    transition: all .15s;
  }
  .btn-load:hover { border-color: var(--gold); color: var(--gold); }
  .btn-load.loaded { border-color: var(--green); color: var(--green); }

  /* ── CARGA INICIAL ── */
  #screen-load {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: calc(100vh - 55px);
    gap: 20px;
  }
  .drop-zone {
    width: 380px;
    border: 2px dashed var(--border);
    border-radius: 12px;
    padding: 48px 32px;
    text-align: center;
    cursor: pointer;
    transition: all .2s;
  }
  .drop-zone:hover, .drop-zone.over {
    border-color: var(--gold);
    background: rgba(201,168,76,.05);
  }
  .drop-icon { font-size: 36px; margin-bottom: 12px; }
  .drop-label { font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 700; color: var(--text); }
  .drop-sub { font-size: 11px; color: var(--text-dim); margin-top: 6px; }
  #file-input { display: none; }

  /* ── LAYOUT PRINCIPAL ── */
  #screen-pos {
    display: none;
    grid-template-columns: 1fr 380px;
    grid-template-rows: auto 1fr;
    height: calc(100vh - 55px);
  }
  #screen-pos.active { display: grid; }

  /* ── PANEL IZQUIERDO — ESCÁNER + RESULTADOS ── */
  .panel-scan {
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .scan-bar {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .scan-bar input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 15px;
    padding: 10px 14px;
    outline: none;
    transition: border-color .15s;
  }
  .scan-bar input:focus { border-color: var(--gold); }
  .scan-bar input::placeholder { color: var(--text-dim); }

  .btn-scan {
    padding: 10px 18px;
    background: var(--gold);
    border: none;
    border-radius: var(--radius);
    color: #000;
    font-family: 'DM Mono', monospace;
    font-weight: 500;
    font-size: 13px;
    cursor: pointer;
    transition: opacity .15s;
  }
  .btn-scan:hover { opacity: .85; }

  /* Resultado de búsqueda */
  .result-area {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
  }

  .result-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 12px;
    display: flex;
    gap: 16px;
    align-items: flex-start;
    animation: fadeIn .15s ease;
  }
  .result-card.hit { border-color: var(--gold-dim); }
  .result-card.miss { border-color: var(--red); }

  @keyframes fadeIn { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:none; } }

  .result-info { flex: 1; }
  .result-name {
    font-family: 'Syne', sans-serif;
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
    line-height: 1.3;
    margin-bottom: 6px;
  }
  .result-meta { font-size: 11px; color: var(--text-dim); margin-bottom: 10px; }
  .result-price {
    font-size: 22px;
    font-weight: 500;
    color: var(--gold);
  }
  .result-ean { font-size: 10px; color: var(--text-dim); margin-top: 4px; }

  .btn-add {
    padding: 10px 18px;
    background: var(--green);
    border: none;
    border-radius: var(--radius);
    color: #000;
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition: opacity .15s;
  }
  .btn-add:hover { opacity: .85; }

  .result-miss-label {
    font-size: 13px;
    color: var(--red);
  }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-dim);
  }
  .empty-icon { font-size: 40px; margin-bottom: 12px; opacity: .4; }
  .empty-label { font-size: 13px; }

  /* ── PANEL DERECHO — CARRITO ── */
  .panel-cart {
    display: flex;
    flex-direction: column;
    background: var(--surface);
    overflow: hidden;
  }

  .cart-header {
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .cart-title {
    font-family: 'Syne', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .06em;
    color: var(--text-dim);
    text-transform: uppercase;
  }
  .btn-clear {
    font-size: 11px;
    color: var(--text-dim);
    background: none;
    border: none;
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 4px;
    transition: color .15s;
  }
  .btn-clear:hover { color: var(--red); }

  .cart-items {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
  }

  .cart-item {
    display: flex;
    gap: 10px;
    align-items: center;
    padding: 10px 8px;
    border-bottom: 1px solid var(--border);
  }
  .cart-item-info { flex: 1; min-width: 0; }
  .cart-item-name {
    font-size: 12px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: var(--text);
  }
  .cart-item-meta { font-size: 10px; color: var(--text-dim); margin-top: 2px; }
  .cart-item-price { font-size: 13px; color: var(--gold); white-space: nowrap; }

  .qty-ctrl {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .qty-btn {
    width: 22px;
    height: 22px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    border-radius: 4px;
    cursor: pointer;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color .1s;
  }
  .qty-btn:hover { border-color: var(--gold); }
  .qty-val { font-size: 13px; min-width: 16px; text-align: center; }

  .cart-empty {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-dim);
    font-size: 12px;
  }

  /* ── FOOTER CARRITO ── */
  .cart-footer {
    border-top: 1px solid var(--border);
    padding: 14px 18px;
  }
  .cart-total-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 14px;
  }
  .cart-total-label { font-size: 12px; color: var(--text-dim); }
  .cart-total-amount {
    font-family: 'Syne', sans-serif;
    font-size: 26px;
    font-weight: 800;
    color: var(--gold);
  }

  .pay-methods {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 10px;
  }
  .btn-pay {
    padding: 12px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    border-radius: var(--radius);
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    cursor: pointer;
    transition: all .15s;
    text-align: center;
  }
  .btn-pay:hover { border-color: var(--gold); color: var(--gold); }
  .btn-pay.selected { border-color: var(--gold); background: rgba(201,168,76,.12); color: var(--gold); }

  .btn-cobrar {
    width: 100%;
    padding: 14px;
    background: var(--gold);
    border: none;
    border-radius: var(--radius);
    color: #000;
    font-family: 'Syne', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: .04em;
    transition: opacity .15s;
  }
  .btn-cobrar:hover { opacity: .9; }
  .btn-cobrar:disabled { opacity: .3; cursor: default; }

  /* ── MODAL COBRO ── */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.7);
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
    display: none;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px;
    width: 340px;
    text-align: center;
  }
  .modal-icon { font-size: 42px; margin-bottom: 12px; }
  .modal-title {
    font-family: 'Syne', sans-serif;
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .modal-amount {
    font-size: 32px;
    font-weight: 500;
    color: var(--gold);
    margin: 12px 0;
  }
  .modal-method { font-size: 12px; color: var(--text-dim); margin-bottom: 20px; }
  .modal-actions { display: flex; gap: 10px; }
  .btn-modal {
    flex: 1;
    padding: 12px;
    border-radius: var(--radius);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    transition: all .15s;
  }
  .btn-modal.primary {
    background: var(--green);
    border-color: var(--green);
    color: #000;
    font-weight: 500;
  }
  .btn-modal:hover { opacity: .85; }

  /* ── TOAST ── */
  #toast {
    position: fixed;
    bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 20px;
    font-size: 13px;
    opacity: 0;
    transition: all .25s;
    z-index: 200;
    white-space: nowrap;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.ok { border-color: var(--green); color: var(--green); }
  #toast.err { border-color: var(--red); color: var(--red); }

  /* ── STATS BAR ── */
  .stats-bar {
    padding: 8px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 24px;
    font-size: 11px;
    color: var(--text-dim);
  }
  .stats-bar span { color: var(--text); }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-brand">IPANEMA IBIZA</div>
  <div class="header-right">
    <div class="header-date" id="header-date"></div>
    <button class="btn-load" id="btn-load-excel" onclick="document.getElementById('file-input').click()">
      Cargar Excel
    </button>
    <input type="file" id="file-input" accept=".xlsx,.xls">
  </div>
</div>

<!-- PANTALLA CARGA -->
<div id="screen-load">
  <div class="drop-zone" id="drop-zone">
    <div class="drop-icon">📂</div>
    <div class="drop-label">Template_pedidos.xlsx</div>
    <div class="drop-sub">Arrastrá el archivo aquí o hacé clic para seleccionar</div>
  </div>
</div>

<!-- POS PRINCIPAL -->
<div id="screen-pos">

  <!-- Stats -->
  <div class="stats-bar" style="grid-column:1/-1">
    Catálogo: <span id="stat-items">—</span> productos &nbsp;·&nbsp;
    Ventas hoy: <span id="stat-ventas">0</span> &nbsp;·&nbsp;
    Total hoy: <span id="stat-total">0,00 €</span>
  </div>

  <!-- Panel izquierdo: escáner -->
  <div class="panel-scan" style="grid-row:2">
    <div class="scan-bar">
      <input type="text" id="ean-input" placeholder="Escaneá o ingresá EAN..." autocomplete="off" autofocus>
      <button class="btn-scan" onclick="buscar()">Buscar</button>
    </div>
    <div class="result-area" id="result-area">
      <div class="empty-state">
        <div class="empty-icon">🔍</div>
        <div class="empty-label">Esperando escaneo...</div>
      </div>
    </div>
  </div>

  <!-- Panel derecho: carrito -->
  <div class="panel-cart" style="grid-row:2">
    <div class="cart-header">
      <div class="cart-title">Carrito</div>
      <button class="btn-clear" onclick="limpiarCarrito()">Limpiar</button>
    </div>
    <div class="cart-items" id="cart-items">
      <div class="cart-empty">Sin productos</div>
    </div>
    <div class="cart-footer">
      <div class="cart-total-row">
        <div class="cart-total-label">TOTAL</div>
        <div class="cart-total-amount" id="cart-total">0,00 €</div>
      </div>
      <div class="pay-methods">
        <button class="btn-pay selected" id="pay-efectivo" onclick="seleccionarPago('efectivo')">Efectivo</button>
        <button class="btn-pay" id="pay-tarjeta" onclick="seleccionarPago('tarjeta')">Tarjeta</button>
      </div>
      <button class="btn-cobrar" id="btn-cobrar" onclick="cobrar()">COBRAR</button>
    </div>
  </div>

</div>

<!-- MODAL CONFIRMACIÓN -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-icon">💳</div>
    <div class="modal-title">Confirmar cobro</div>
    <div class="modal-amount" id="modal-amount"></div>
    <div class="modal-method" id="modal-method"></div>
    <div class="modal-actions">
      <button class="btn-modal" onclick="cerrarModal()">Cancelar</button>
      <button class="btn-modal primary" onclick="confirmarCobro()">Confirmar</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// ── ESTADO ─────────────────────────────────────────
let catalogo  = {};   // EAN → {nombre, talla, color, precio, marca}
let carrito   = [];   // [{ean, nombre, talla, color, precio, qty}]
let metodoPago = 'efectivo';
let ventasHoy  = JSON.parse(localStorage.getItem('ipanema_ventas_local') || '[]');
const HOY = new Date().toDateString();
ventasHoy = ventasHoy.filter(v => new Date(v.ts).toDateString() === HOY);

// ── FECHA ───────────────────────────────────────────
function actualizarFecha() {
  const now = new Date();
  document.getElementById('header-date').textContent =
    now.toLocaleDateString('es-ES', {weekday:'short', day:'numeric', month:'short'}) +
    ' ' + now.toLocaleTimeString('es-ES', {hour:'2-digit', minute:'2-digit'});
}
actualizarFecha();
setInterval(actualizarFecha, 30000);

// ── CARGA EXCEL ─────────────────────────────────────
function procesarExcel(file) {
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const wb = XLSX.read(e.target.result, {type:'array'});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, {defval:''});

      catalogo = {};
      let cargados = 0;

      for (const row of rows) {
        // Detectar columna EAN: COD. EAN o Barcode
        const ean = normEAN(row['COD. EAN'] ?? row['Barcode'] ?? row['EAN'] ?? '');
        if (!ean || ean.length < 8) continue;

        const nombre = String(row['Description'] || row['Product Description'] || '').trim();
        const talla  = String(row['Size'] || '').trim();
        const color  = String(row['Color'] || '').trim().split(' ').slice(1).join(' ') || String(row['Color'] || '').trim();
        const precio = parseFloat(row['S.R.P.'] || row['PVP'] || row['Precio'] || 0);
        const marca  = String(row['Brand'] || row['MARCA'] || '').trim();

        if (!nombre || !precio) continue;

        catalogo[ean] = {nombre, talla, color, precio, marca};
        cargados++;
      }

      if (cargados === 0) {
        toast('No se encontraron productos con EAN y precio', 'err');
        return;
      }

      document.getElementById('screen-load').style.display = 'none';
      document.getElementById('screen-pos').classList.add('active');
      document.getElementById('stat-items').textContent = cargados.toLocaleString('es-ES');
      document.getElementById('btn-load-excel').textContent = `${cargados} productos`;
      document.getElementById('btn-load-excel').classList.add('loaded');
      document.getElementById('ean-input').focus();
      actualizarStats();
      toast(`${cargados} productos cargados`, 'ok');
    } catch(err) {
      toast('Error leyendo Excel: ' + err.message, 'err');
    }
  };
  reader.readAsArrayBuffer(file);
}

document.getElementById('file-input').addEventListener('change', e => {
  if (e.target.files[0]) procesarExcel(e.target.files[0]);
});

const dropZone = document.getElementById('drop-zone');
dropZone.addEventListener('click', () => document.getElementById('file-input').click());
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('over'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('over');
  const f = e.dataTransfer.files[0];
  if (f) procesarExcel(f);
});

// ── NORMALIZACIÓN EAN ───────────────────────────────
// Excel puede guardar EANs como número (float, notación científica).
// Forzamos a entero string en ambos lados para que el match sea exacto.
function normEAN(v) {
  const s = String(v).trim();
  // Notación científica → número entero
  const n = Number(s);
  if (!isNaN(n) && isFinite(n) && s !== '') return String(Math.round(n));
  return s.replace(/\.0+$/, '');
}

// ── BÚSQUEDA ────────────────────────────────────────
document.getElementById('ean-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') buscar();
});

function buscar() {
  const ean = normEAN(document.getElementById('ean-input').value);
  if (!ean) return;

  const area = document.getElementById('result-area');
  const prod = catalogo[ean];

  if (prod) {
    const card = document.createElement('div');
    card.className = 'result-card hit';
    card.innerHTML = `
      <div class="result-info">
        <div class="result-name">${prod.nombre}</div>
        <div class="result-meta">${prod.marca ? prod.marca + ' · ' : ''}Talla ${prod.talla}${prod.color ? ' · ' + prod.color : ''}</div>
        <div class="result-price">${formatPrecio(prod.precio)}</div>
        <div class="result-ean">EAN: ${ean}</div>
      </div>
      <button class="btn-add" onclick="agregarAlCarrito('${ean}')">+ Agregar</button>
    `;
    area.innerHTML = '';
    area.appendChild(card);
    agregarAlCarrito(ean);
  } else {
    const card = document.createElement('div');
    card.className = 'result-card miss';
    card.innerHTML = `
      <div class="result-info">
        <div class="result-miss-label">EAN no encontrado</div>
        <div class="result-meta" style="margin-top:4px">${ean}</div>
      </div>
    `;
    area.innerHTML = '';
    area.appendChild(card);
    toast('EAN no encontrado en catálogo', 'err');
  }

  document.getElementById('ean-input').value = '';
  document.getElementById('ean-input').focus();
}

// ── CARRITO ─────────────────────────────────────────
function agregarAlCarrito(ean) {
  const prod = catalogo[ean];
  if (!prod) return;

  const existente = carrito.find(i => i.ean === ean);
  if (existente) {
    existente.qty++;
  } else {
    carrito.push({ean, ...prod, qty: 1});
  }
  renderCarrito();
  toast(`${prod.nombre.split(' ').slice(0,3).join(' ')} — agregado`, 'ok');
}

function cambiarQty(ean, delta) {
  const item = carrito.find(i => i.ean === ean);
  if (!item) return;
  item.qty += delta;
  if (item.qty <= 0) carrito = carrito.filter(i => i.ean !== ean);
  renderCarrito();
}

function limpiarCarrito() {
  carrito = [];
  renderCarrito();
  document.getElementById('result-area').innerHTML = `
    <div class="empty-state"><div class="empty-icon">🔍</div><div class="empty-label">Esperando escaneo...</div></div>`;
}

function renderCarrito() {
  const el = document.getElementById('cart-items');
  const total = carrito.reduce((s, i) => s + i.precio * i.qty, 0);

  if (carrito.length === 0) {
    el.innerHTML = '<div class="cart-empty">Sin productos</div>';
  } else {
    el.innerHTML = carrito.map(item => `
      <div class="cart-item">
        <div class="cart-item-info">
          <div class="cart-item-name">${item.nombre}</div>
          <div class="cart-item-meta">T.${item.talla} · ${formatPrecio(item.precio)}</div>
        </div>
        <div class="qty-ctrl">
          <button class="qty-btn" onclick="cambiarQty('${item.ean}', -1)">−</button>
          <span class="qty-val">${item.qty}</span>
          <button class="qty-btn" onclick="cambiarQty('${item.ean}', 1)">+</button>
        </div>
        <div class="cart-item-price">${formatPrecio(item.precio * item.qty)}</div>
      </div>
    `).join('');
  }

  document.getElementById('cart-total').textContent = formatPrecio(total);
  document.getElementById('btn-cobrar').disabled = carrito.length === 0;
}

// ── PAGO ────────────────────────────────────────────
function seleccionarPago(m) {
  metodoPago = m;
  document.querySelectorAll('.btn-pay').forEach(b => b.classList.remove('selected'));
  document.getElementById('pay-' + m).classList.add('selected');
}

function cobrar() {
  if (carrito.length === 0) return;
  const total = carrito.reduce((s, i) => s + i.precio * i.qty, 0);
  document.getElementById('modal-amount').textContent = formatPrecio(total);
  document.getElementById('modal-method').textContent =
    metodoPago === 'efectivo' ? 'Pago en efectivo' : 'Pago con tarjeta';
  document.getElementById('modal').classList.add('open');
}

function cerrarModal() {
  document.getElementById('modal').classList.remove('open');
}

function confirmarCobro() {
  const total = carrito.reduce((s, i) => s + i.precio * i.qty, 0);
  const venta = {
    ts: Date.now(),
    items: carrito.map(i => ({...i})),
    total,
    metodo: metodoPago
  };
  ventasHoy.push(venta);
  localStorage.setItem('ipanema_ventas_local', JSON.stringify(ventasHoy));
  cerrarModal();
  limpiarCarrito();
  actualizarStats();
  toast(`Venta registrada: ${formatPrecio(total)}`, 'ok');
}

function actualizarStats() {
  const totalHoy = ventasHoy.reduce((s, v) => s + v.total, 0);
  document.getElementById('stat-ventas').textContent = ventasHoy.length;
  document.getElementById('stat-total').textContent = formatPrecio(totalHoy);
}

actualizarStats();

// ── UTILS ───────────────────────────────────────────
function formatPrecio(n) {
  return n.toLocaleString('es-ES', {minimumFractionDigits:2, maximumFractionDigits:2}) + ' €';
}

function toast(msg, type = '') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'show ' + (type === 'ok' ? 'ok' : type === 'err' ? 'err' : '');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.className = '', 2500);
}
</script>
</body>
</html>
